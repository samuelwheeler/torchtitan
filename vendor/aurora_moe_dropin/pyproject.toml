[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-moe"
version = "0.1.0"
description = "Exact expert-parallel MoE layer for Intel GPU Max on Aurora"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aurora_moe._kernels" = ["csrc/*.sycl", "csrc/*.hpp"]
